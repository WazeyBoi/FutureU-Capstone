# FutureU Application Configuration
spring.application.name=FutureU_Capstone

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db_futureu
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=@4Ndre930;

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Error Handling
server.error.include-binding-errors=never

# JWT Configuration
futureu.app.jwtSecret=FutureUSecretKeyForJWTGenerationMustBeLongEnoughAndSecure32Chars
futureu.app.jwtExpirationMs=10800000
futureu.app.refreshTokenExpirationMs=604800000

# Cookie Configuration
futureu.app.cookieDomain=localhost
futureu.app.cookieSecure=false
futureu.app.cookieSameSite=strict

# CORS Configuration
futureu.app.allowedOrigins=http://localhost:8080,http://localhost:5173

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict