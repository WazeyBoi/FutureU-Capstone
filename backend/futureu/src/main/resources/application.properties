spring.application.name=FutureU_Capstone
 
# JDBC connection [name your databse futureudb]

spring.datasource.url=jdbc:mysql://localhost:3306/futureu_db

# datasource driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# database login credentials 
spring.datasource.username=root
spring.datasource.password=@4Ndre930;

 
# autocreate tables 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
 
# for stack trace error not to appear  
server.error.include-binding-errors=never

# JWT Properties
futureu.app.jwtSecret=FutureUSecretKeyForJWTGenerationMustBeLongEnoughAndSecure32Chars
futureu.app.jwtExpirationMs=10800000

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://accounts.google.com/o/oauth2/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub